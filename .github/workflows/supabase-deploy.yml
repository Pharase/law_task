# Push to main that touches supabase/ -> test, apply new migrations, deploy the api function.
# Needs only the repo secret SUPABASE_ACCESS_TOKEN: with no DB password set, the CLI logs in
# to the database through a temporary role created with the access token.
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch: # manual "Run workflow" button

concurrency: supabase-deploy # never run two deploys at once

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: edymfgeecbsmepdveqkj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "supabase/functions/api/*.test.ts" "gscript/*.test.cjs"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      # --remote: newer CLIs default to a local stack; --yes: CI can't answer the confirm prompt
      - run: supabase db push --remote --yes
      - run: supabase secrets set LINE_CHANNEL_ID=2012450429 --yes # public: the number before "-" in the LIFF ID
      - run: supabase functions deploy api --yes

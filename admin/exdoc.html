<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ex Doc – admin</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/work.js"></script>
  <script src="../js/backup.js"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <p id="status" class="muted" role="status">Loading…</p>

  <div id="page" hidden>
    <form class="card" id="uploadForm">
      <h2>อัปโหลด PDF</h2>
      <p class="muted">ตัวอย่างเอกสารฝ่ายกฎหมาย: สมาชิกดูและดาวน์โหลดได้อย่างเดียว · ไม่ถูกลบอัตโนมัติ</p>
      <label for="pdf">ไฟล์ PDF (ไม่เกิน 20 MB)</label>
      <input type="file" id="pdf" accept="application/pdf,.pdf" required>
      <label for="docTitle">ชื่อเอกสาร · Title</label>
      <input id="docTitle" maxlength="200" required>
      <label for="docGroup">กลุ่ม · Group</label>
      <select id="docGroup"></select>
      <button>อัปโหลด</button>
      <p id="uploadMsg" role="status"></p>
    </form>
    <section class="card">
      <h2>กลุ่มเอกสาร · Groups</h2>
      <p class="muted">ลบกลุ่มแล้ว เอกสารในกลุ่มจะย้ายไป "อื่นๆ · ไม่มีกลุ่ม" (ไม่ลบเอกสาร)</p>
      <div class="row">
        <input id="newGroup" maxlength="100" placeholder="ชื่อกลุ่มใหม่" aria-label="New group name">
        <button type="button" class="small" id="addGroupBtn">เพิ่มกลุ่ม</button>
      </div>
      <div id="groupList"></div>
    </section>
    <section class="card">
      <h2>เอกสารทั้งหมด <span id="docCount" class="badge"></span></h2>
      <div id="docList"></div>
    </section>
  </div>

  <script>
    const MAX = 20 * 1024 * 1024;
    const kb = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB");
    const groupSelect = (groups, value) => {
      const s = el("select", { ariaLabel: "Group" }, el("option", { value: "", textContent: NO_GROUP }),
        ...groups.map((g) => el("option", { value: g.id, textContent: g.name })));
      s.value = value ?? "";
      return s;
    };
    const run = async (fn) => { try { await fn(); loadDocs(); } catch (e) { alert(e.message); } };

    function renderGroups(groups, docs) {
      const keep = $("docGroup").value;
      $("docGroup").replaceWith(Object.assign(groupSelect(groups, keep), { id: "docGroup" }));
      $("groupList").replaceChildren(...(groups.length ? groups.map((g) => {
        const rename = el("button", { type: "button", className: "small secondary", textContent: "เปลี่ยนชื่อ" });
        rename.onclick = () => {
          const name = prompt("ชื่อกลุ่มใหม่", g.name);
          if (name && name !== g.name) run(() => api("exdocGroupSave", { id: g.id, name }));
        };
        const del = el("button", { type: "button", className: "small danger", textContent: "ลบกลุ่ม" });
        del.onclick = () => { if (confirm(`ลบกลุ่ม "${g.name}"? เอกสารจะย้ายไป "${NO_GROUP}"`)) run(() => api("exdocGroupDelete", { id: g.id })); };
        return el("div", { className: "doc-row" },
          el("div", { className: "grow" }, el("strong", { textContent: g.name }),
            el("span", { className: "muted", textContent: ` · ${docs.filter((d) => d.group_id === g.id).length} เอกสาร` })),
          rename, del);
      }) : [el("p", { className: "muted", textContent: "ยังไม่มีกลุ่ม" })]));
    }

    $("addGroupBtn").onclick = () => {
      const name = $("newGroup").value.trim();
      if (name) run(async () => { await api("exdocGroupSave", { name }); $("newGroup").value = ""; });
    };

    async function loadDocs() {
      const { groups, docs } = await api("listExDocs");
      renderGroups(groups, docs);
      $("docCount").textContent = docs.length;
      const row = (d) => {
        const rename = el("button", { type: "button", className: "small secondary", textContent: "เปลี่ยนชื่อ" });
        rename.onclick = async () => {
          const title = prompt("ชื่อเอกสารใหม่", d.title);
          if (!title || title === d.title) return;
          try { await api("exdocRename", { id: d.id, title }); loadDocs(); } catch (e) { alert(e.message); }
        };
        const del = el("button", { type: "button", className: "small danger", textContent: "ลบ" });
        del.onclick = async () => {
          if (!confirm(`ลบ "${d.title}"? ลบแล้วกู้คืนไม่ได้`)) return;
          try { await api("exdocDelete", { id: d.id }); loadDocs(); } catch (e) { alert(e.message); }
        };
        const move = groupSelect(groups, d.group_id);
        move.onchange = () => run(() => api("exdocSetGroup", { id: d.id, group_id: move.value || null }));
        return el("div", { className: "doc-row" },
          el("div", { className: "grow" }, el("a", { href: d.previewUrl, target: "_blank", textContent: d.title }),
            el("div", { className: "muted", textContent: `${d.name} · ${kb(d.size)} · ${thDate(d.created_at.slice(0, 10))}` })),
          move, rename, del);
      };
      $("docList").replaceChildren(...(docs.length ? groupDocs(groups, docs).map((s) =>
        el("details", { className: "doc-group", open: true },
          el("summary", {}, el("strong", { textContent: s.name }), el("span", { className: "badge", textContent: s.docs.length })),
          ...s.docs.map(row)))
        : [el("p", { className: "muted", textContent: "ยังไม่มีเอกสาร" })]));
    }

    $("pdf").onchange = () => {
      const f = $("pdf").files[0];
      if (f && !$("docTitle").value) $("docTitle").value = f.name.replace(/\.pdf$/i, "");
    };

    $("uploadForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = $("pdf").files[0];
      if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) return void ($("uploadMsg").textContent = "PDF เท่านั้น");
      if (f.size > MAX) return void ($("uploadMsg").textContent = "ไฟล์ใหญ่เกิน 20 MB");
      const btn = e.submitter; btn.disabled = true;
      try {
        $("uploadMsg").textContent = "กำลังอัปโหลด…";
        const { path, signedUrl } = await api("exdocUploadUrl", { name: f.name, size: f.size });
        const body = new FormData(); // same request shape as supabase-js uploadToSignedUrl
        body.append("cacheControl", "3600");
        body.append("", new File([f], f.name, { type: "application/pdf" }));
        const put = await fetch(signedUrl, { method: "PUT", body });
        if (!put.ok) throw new Error("upload failed (" + put.status + ")");
        await api("exdocSave", { path, title: $("docTitle").value, name: f.name, size: f.size, group_id: $("docGroup").value || null });
        $("uploadMsg").textContent = "อัปโหลดแล้ว";
        $("uploadForm").reset();
        loadDocs();
      } catch (err) { $("uploadMsg").textContent = "Error: " + err.message; }
      btn.disabled = false;
    };

    start("admin").then(() => {
      initBackupBanner();
      $("status").hidden = true;
      $("page").hidden = false;
      return loadDocs();
    }).catch((err) => {
      $("status").textContent = "Error: " + err.message;
      $("status").className = "error";
    });
  </script>
</body>
</html>

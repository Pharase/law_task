<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดตามงาน – law_task</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/work.js"></script>
  <script src="../js/admin-tasks.js"></script>
  <script src="../js/backup.js"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <p id="status" class="loading" role="status">Loading…</p>

  <div id="page" hidden>
    <section class="card" id="warnCard" hidden>
      <h2>ข้อมูลในชีตที่ต้องแก้ · Sheet rows to fix</h2>
      <p class="muted">These rows are hidden from the app until they are fixed in the Google Sheet.</p>
      <ul id="warnList"></ul>
    </section>
    <div class="work-grid">

      <section class="card">
        <h2>รอตรวจ · Waiting for review <span id="reviewCount" class="badge"></span></h2>
        <div id="reviewList"></div>
      </section>
    </div>

    <section class="card">
      <h2>งานทั้งหมด · All tasks</h2>
      <div class="row filters">
        <select id="fOwner" aria-label="Member"><option value="">ทุกคน</option></select>
        <select id="fBuilding" aria-label="Building"><option value="">ทุกนิติบุคคล</option></select>
        <select id="fState" aria-label="State">
          <option value="">ทุกสถานะ</option><option value="on_process">On Process</option>
          <option value="submitted">รอตรวจ</option><option value="approved">อนุมัติ</option><option value="cancelled">ยกเลิก</option>
        </select>
        <label class="inline"><input type="checkbox" id="fOverdue"> เลยกำหนด</label>
      </div>
      <div id="allList"></div>
    </section>
  </div>

  <script>
    start("admin").then((me) => { initBackupBanner(); return initTracking(); }).catch((err) => {
      $("status").textContent = "Error: " + err.message;
      $("status").className = "error";
    });
  </script>
</body>
</html>

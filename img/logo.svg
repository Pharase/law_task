<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="law_task">
  <!-- Lady Justice: blindfolded, scales held out in the left hand, sword lowered in the right. Prozy cyan -> blue. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02D7F4"/>
      <stop offset="1" stop-color="#4F63F0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- arm holding the scales out to the side -->
    <path d="M38 28L16 20"/>
    <!-- scales -->
    <path d="M16 16v4M6 20h20"/>
    <path d="M8 20l-4 9M8 20l4 9M24 20l-4 9M24 20l4 9"/>
    <path d="M3 29a5 3 0 0 0 10 0zM19 29a5 3 0 0 0 10 0z" fill="url(#g)" fill-opacity=".35"/>
    <!-- sword, lowered -->
    <path d="M56 32v25M52.5 35h7M56 28v4"/>
    <path d="M46 29l9 5"/>
  </g>
  <!-- head with blindfold -->
  <circle cx="42" cy="17" r="5.2" fill="url(#g)"/>
  <rect x="36.4" y="15.4" width="11.2" height="2.6" rx="1.3" fill="#000" fill-opacity=".55"/>
  <!-- robe -->
  <path d="M38 24h8l3.5 9-2 2 3.5 22H33l3.5-22-2-2z" fill="url(#g)"/>
  <path d="M42 26v30" stroke="#000" stroke-opacity=".25" stroke-width="1.4"/>
</svg>

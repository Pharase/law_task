<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="law_task">
  <!-- Lady Justice (CI mark from the rich menu), redrawn as a vector: blindfolded, scales raised, sword lowered. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3a4"/>
      <stop offset=".45" stop-color="#e2b866"/>
      <stop offset="1" stop-color="#a8752e"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d892"/>
      <stop offset="1" stop-color="#b9843a"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6b3f17" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6b3f17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="225" cy="468" rx="140" ry="16" fill="url(#shadow)"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- hair falling behind the shoulders -->
    <path d="M182 44c-12 14-18 36-18 60 0 20-8 38-20 52 18-2 32-14 38-32l8-50z" fill="#3a2410"/>

    <!-- sword: broad leaf blade pointing down-left from the hand -->
    <g stroke="#3a2410" stroke-width="6">
      <path d="M124 258l22 13-78 96c-8 10-22 16-38 15 0-15 7-28 17-37z" fill="url(#gold)"/>
      <path d="M112 246l40 23" fill="none" stroke-width="11"/>
      <path d="M112 246l40 23" fill="none" stroke="url(#goldV)" stroke-width="4"/>
      <path d="M132 266L56 360" fill="none" stroke="#a8752e" stroke-width="2.5"/>
    </g>

    <!-- arms: outline pass, then gold -->
    <path d="M234 116c26-28 56-58 84-88M182 130c-8 40-26 80-50 118" fill="none" stroke="#3a2410" stroke-width="24"/>
    <path d="M234 116c26-28 56-58 84-88M182 130c-8 40-26 80-50 118" fill="none" stroke="url(#gold)" stroke-width="13"/>
    <circle cx="320" cy="27" r="9" fill="url(#gold)" stroke="#3a2410" stroke-width="5"/>

    <!-- scales hanging from the raised hand -->
    <g stroke="#3a2410" fill="none">
      <path d="M324 34l8 18" stroke-width="5"/>
      <path d="M300 54h64" stroke-width="7"/>
      <path d="M302 54l-11 38M302 54l11 38M362 54l-11 38M362 54l11 38" stroke-width="3"/>
      <path d="M286 92h32c-2 11-8 16-16 16s-14-5-16-16zM346 92h32c-2 11-8 16-16 16s-14-5-16-16z" fill="url(#gold)" stroke-width="4.5"/>
      <path d="M300 54h64" stroke="url(#goldV)" stroke-width="2.5"/>
    </g>

    <!-- robe: slim bust and waist, flaring into a rippled hem -->
    <path d="M200 96C190 100 182 104 179 112C173 126 171 142 173 156C175 180 185 200 183 226C182 248 179 268 177 288C173 322 163 352 143 380C129 400 115 420 105 444C123 456 141 450 161 456C181 448 201 460 221 454C241 446 263 458 283 450C301 444 317 454 333 442C321 416 299 398 281 372C263 346 257 312 253 280C251 260 249 242 251 222C253 204 257 186 255 168C253 146 248 128 238 116C232 108 222 100 212 97Z"
          fill="url(#gold)" stroke="#3a2410" stroke-width="6.5"/>
    <!-- drapery folds -->
    <g fill="none" stroke="#9c6a25" stroke-width="3.5" opacity=".85">
      <path d="M182 196c18 10 40 12 60 4"/>
      <path d="M208 206c-2 70-8 140-34 230"/>
      <path d="M230 260c6 60 26 120 64 178"/>
      <path d="M192 290c-14 50-36 100-64 146"/>
      <path d="M216 300c4 50 6 100 2 140"/>
    </g>

    <!-- head + blindfold -->
    <circle cx="206" cy="62" r="28" fill="url(#gold)" stroke="#3a2410" stroke-width="6.5"/>
    <path d="M180 42c8-14 22-20 34-18 12 2 20 8 22 18-18-6-38-6-56 0z" fill="#3a2410"/>
    <path d="M179 56c17-5 37-5 54 0v10c-17-5-37-5-54 0z" fill="#3a2410"/>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../js/app.js?v=20261122"></script>
  <script src="../js/work.js?v=20261149"></script>
  <link rel="stylesheet" href="../css/app.css?v=20261149">
</head>
<body>
  <p id="status" class="loading" role="status"></p>
  <div id="page" hidden>
    <section class="card">
      <div class="row card-head">
        <h2 class="grow">ใบแจ้งหนี้ค้างเบิก · Invoices <span id="invCount" class="badge"></span>
          <span id="invNew" class="inv-new" hidden></span></h2>
        <button type="button" class="small" id="addBtn" hidden>+ เพิ่มรายการเบิก</button>
      </div>

      <!-- Admins: add / edit one invoice -->
      <form id="invForm" class="inv-form" hidden>
        <input type="hidden" name="id">
        <!-- searchable drop-downs (same look as the assign form's building list); the hidden inputs carry the values -->
        <label for="fBuildingBtn">นิติบุคคล · Building</label>
        <input type="hidden" id="fBuilding" name="building">
        <div class="ms" id="fBuildingPick"></div>
        <p class="muted small-note" id="fType"></p>
        <!-- รายการเบิก: the old sheet "เบิกเงินทนาย" list, or type something else in the search box -->
        <label for="fSubjectBtn">รายการเบิก · Subject</label>
        <input type="hidden" id="fSubject" name="subject">
        <div class="ms" id="fSubjectPick"></div>
        <label for="fLawyerBtn">ทนาย · Lawyer</label>
        <input type="hidden" id="fLawyer" name="lawyer">
        <div class="ms" id="fLawyerPick"></div>
        <label for="fAmount">ยอด (บาท) · Amount</label>
        <input id="fAmount" name="amount" inputmode="decimal" placeholder="เช่น 1,500.00" required>
        <div class="inv-dates">
          <div><label for="fBilled">วันวางบิล</label><input type="date" id="fBilled" name="billed_on"></div>
          <div><label for="fTransfer">วันโอน</label><input type="date" id="fTransfer" name="transfer_on"></div>
          <div><label for="fReceipt">วันส่งใบเสร็จ</label><input type="date" id="fReceipt" name="receipt_on"></div>
        </div>
        <label for="fStatus">สถานะ · Status</label>
        <select id="fStatus" name="status"></select>
        <label for="fNote">หมายเหตุ · Note</label>
        <textarea id="fNote" name="note" rows="2" maxlength="1000"></textarea>
        <!-- not part of the saved row: uploaded to the invoice's Google Drive folder after it is saved -->
        <label for="fFiles">แนบไฟล์ · Files (PDF / รูป, ไม่เกิน 10 MB ต่อไฟล์)</label>
        <input type="file" id="fFiles" multiple accept="application/pdf,image/jpeg,image/png,image/webp">
        <div class="row tools">
          <button class="small">บันทึก · Save</button>
          <button type="button" class="small secondary" id="cancelBtn">ยกเลิก</button>
        </div>
        <p id="formMsg" class="error upload-msg" role="alert"></p>
      </form>

      <div class="inv-warn" id="invWarn" hidden>
        <strong>ข้อมูลในชีต Invoices ที่ต้องแก้</strong>
        <ul id="invWarnList"></ul>
      </div>
      <p class="muted small-note" id="invScope" hidden>แสดงเฉพาะนิติบุคคลที่คุณดูแล (ตามข้อมูลการมอบหมาย) และรายการของ "ทุกนิติ"</p>
      <div class="row filters type-tabs" id="typeTabs" role="tablist" aria-label="ประเภท"></div>
      <input type="search" id="q" placeholder="ค้นหา นิติบุคคล หรือ เรื่อง · Search" aria-label="Search invoices">
      <div id="invList"></div>
      <div id="invTotal" class="inv-total muted"></div>
    </section>
  </div>

  <script>
    const STATUS = ["รอทนายวางบิล", "รอนิติชำระเงิน", "รอทนายส่งใบเสร็จ", "เสร็จสิ้น"];
    // รายการเบิก choices from the old sheet "เบิกเงินทนาย"
    const SUBJECTS = ["ค่าทนายชั้นโนติส", "ค่าส่งหนังสือบอกกล่าว", "คชจ ชั้นโนติส", "ค่าทนายชั้นฟ้อง", "คชจ ชั้นฟ้อง", "ค่าธรรมเนียมชั้นฟ้อง",
      "ค่าทนายชั้นบังคับคดี", "คชจ ชั้นบังคับคดี", "ค่าธรรมเนียมชั้นบังคับคดี", "ค่าเดินทาง", "ค่าอื่นๆ"];
    const LAWYERS = ["ศิระ", "บารมี", "ตั้ม", "ลิลลี่", "นิว", "บอม"]; // same sheet; names typed on invoices are suggested too
    const baht =(n) => n.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    let data = { invoices: [], buildings: [], types: [] }, tab = "all", isAdmin = false;

    function renderTabs() {
      const count = (t) => data.invoices.filter((i) => t === "all" || (t === "none" ? !i.type : i.type === t)).length;
      const tabs = [["all", "ทั้งหมด"], ...data.types.map((t) => [t, t])];
      if (count("none")) tabs.push(["none", "ไม่ระบุประเภท"]);
      $("typeTabs").replaceChildren(...tabs.map(([key, label]) => {
        const b = el("button", { type: "button", className: "small " + (key === tab ? "" : "secondary"), textContent: `${label} (${count(key)})` });
        b.setAttribute("role", "tab");
        b.setAttribute("aria-selected", String(key === tab));
        b.onclick = () => { tab = key; render(); };
        return b;
      }));
    }

    function invoiceRow(inv) {
      const dates = [["วางบิล", inv.billed_on], ["โอน", inv.transfer_on], ["ใบเสร็จ", inv.receipt_on]]
        .map(([k, v]) => `${k} ${v ? thDate(v) : "-"}`).join(" · ");
      const row = el("div", { className: "inv-row" },
        el("div", { className: "grow" },
          el("strong", { textContent: inv.subject }),
          el("div", { className: "muted", textContent: [inv.building, inv.type, inv.lawyer && "ทนาย " + inv.lawyer, isAdmin && ownerOf(inv.building) && "หัวหน้าทีม " + ownerOf(inv.building)].filter(Boolean).join(" · ") }),
          el("div", { className: "muted small-note", textContent: dates }),
          inv.note && el("div", { className: "muted pre", textContent: inv.note })),
        el("div", { className: "inv-side" },
          statusTrack(inv.status),
          el("div", { className: "inv-price" },
            el("strong", { className: "inv-amount", textContent: "฿" + baht(inv.amount) }),
            inv.id > 0 && el("button", { type: "button", className: "inv-edit", textContent: "📎", title: "ไฟล์แนบ",
              ariaLabel: "ไฟล์แนบ " + inv.subject + (data.newFiles?.[inv.id] ? " (มีไฟล์ใหม่)" : ""),
              onclick: (e) => toggleFiles(inv, e.currentTarget, row) },
              !!data.newFiles?.[inv.id] && el("span", { className: "news-dot", title: "ไฟล์ใหม่จากหัวหน้าทีม" })),
            // rows typed in the sheet without an id (id <= 0) are read-only: fix them in the sheet
            isAdmin && inv.id > 0 && el("button", { type: "button", className: "inv-edit", textContent: "✏️", title: "แก้ไข", ariaLabel: "แก้ไข " + inv.subject, onclick: () => openInvForm(inv) }))));
      row.dataset.inv = inv.id; // for ?invoice=N (LINE button)
      return row;
    }

    // 📎 Files of one invoice (Google Drive folder), collapsed until tapped. Everyone who sees the invoice can open
    // (and print from the viewer); admins also add and delete; the หัวหน้าทีม adds at รอนิติชำระเงิน.
    const fileIcon = (f) => (f.mime === "application/pdf" ? "📄 " : f.mime.startsWith("image/") ? "🖼️ " : "📁 ");
    function toggleFiles(inv, btn, row) {
      let box = row.querySelector(".inv-files");
      if (box) { box.hidden = !box.hidden; btn.setAttribute("aria-expanded", String(!box.hidden)); return; }
      box = el("div", { className: "inv-files" });
      row.append(box);
      btn.setAttribute("aria-expanded", "true");
      const msg = el("p", { className: "muted small-note upload-msg", role: "status" });
      // หัวหน้าทีม (non-admins only get their own buildings in data.buildings) add files at รอนิติชำระเงิน, e.g. the payment slip;
      // only admins delete (the server enforces both, and never lets a member's upload replace a file)
      const canUpload = isAdmin || (inv.status === "รอนิติชำระเงิน" && data.buildings.some((b) => b.name === inv.building));
      const draw = (files) => box.replaceChildren(
        ...(files.length ? files.map((f) => el("div", { className: "inv-file" },
          el("span", { className: "inv-file-name", textContent: fileIcon(f) + f.name }),
          el("button", { type: "button", className: "icon-btn", textContent: "👁️", title: "ดู", ariaLabel: "ดู " + f.name,
            onclick: (e) => openInvoiceFile(inv, f, e.currentTarget, msg) }),
          el("button", { type: "button", className: "icon-btn", textContent: "🖨️", title: "พิมพ์", ariaLabel: "พิมพ์ " + f.name,
            onclick: (e) => printInvoiceFile(inv, f, e.currentTarget, msg) }),
          isAdmin && el("button", { type: "button", className: "icon-btn", textContent: "🗑️", title: "ลบ", ariaLabel: "ลบ " + f.name, onclick: async (e) => {
            if (!confirm(`ลบไฟล์ "${f.name}" ? (ไปที่ถังขยะของ Google Drive)`)) return;
            e.currentTarget.disabled = true;
            try { draw(await api("deleteInvoiceFile", { id: inv.id, fileId: f.id })); } catch (err) { msg.textContent = "❌ " + err.message; e.currentTarget.disabled = false; }
          } })))
          : [el("p", { className: "muted", textContent: "ไม่มีไฟล์แนบ" })]),
        ...(canUpload ? [el("button", { type: "button", className: "small secondary", textContent: "+ แนบไฟล์", onclick: () => pick.click() })] : []), // replaceChildren would print a bare false as text
        msg);
      const pick = el("input", { type: "file", multiple: true, accept: "application/pdf,image/jpeg,image/png,image/webp", onchange: async () => {
        const picked = [...pick.files];
        pick.value = "";
        const { list } = await uploadInvoiceFiles(inv.id, picked, (t) => { msg.textContent = t; });
        if (list) draw(list); // draw keeps msg, so a failure note stays visible
      } });
      box.replaceChildren(el("p", { className: "muted", textContent: "กำลังโหลด…" }));
      api("invoiceFiles", { id: inv.id }).then((files) => {
        draw(files);
        // admin opened it: the server cleared this invoice's new-file dot, so clear it here too
        if (data.newFiles?.[inv.id]) { delete data.newFiles[inv.id]; btn.querySelector(".news-dot")?.remove(); newBadge(); }
      }, (err) => box.replaceChildren(el("p", { className: "error", textContent: err.message })));
    }

    // 👁️ / 🖨️ on an invoice file: viewLinked / printLinked in js/app.js, with this invoice file's signed link
    const invLinks = (inv, f) => () => api("invoiceFileUrl", { id: inv.id, fileId: f.id });
    const openInvoiceFile = (inv, f, btn, msg) => viewLinked(invLinks(inv, f), btn, msg);
    const printInvoiceFile = (inv, f, btn, msg) => printLinked(invLinks(inv, f), f.mime, btn, msg);

    /**
     * One by one, original files unchanged, all into the invoice's one Drive folder. A file with the same name as one
     * already there replaces it (Drive keeps only the newest); a file that fails is skipped and the old version stays.
     * Returns the folder's files after the last good upload (null if none) and the files that failed, with why.
     */
    async function uploadInvoiceFiles(id, files, say) {
      let list = null;
      const failed = [];
      for (const [i, file] of files.entries()) {
        say(`กำลังอัปโหลด ${i + 1}/${files.length}: ${file.name}`);
        const form = new FormData();
        form.append("id", id);
        form.append("file", file);
        try { list = await api("uploadInvoiceFile", form); } catch (err) { failed.push({ file, why: err.message }); }
      }
      say(failed.length ? `❌ อัปโหลดไม่สำเร็จ ${failed.length} ไฟล์ (ไฟล์เดิมยังอยู่): ` + failed.map((x) => `${x.file.name} — ${x.why}`).join(" · ") : "");
      return { list, failed: failed.map((x) => x.file) };
    }

    // Status as a track: 5 points left -> right, filled with an orange -> yellow -> green -> blue gradient up to the
    // current point, ending in an arrow. The status name is always written too, so color is never the only cue.
    const STEP_COLOR = ["#ff8a3d", "#ffc23d", "#3ddc84", "#4f8cff"]; // one per status: orange, yellow, green, blue
    function statusTrack(status) {
      const i = Math.max(0, STATUS.indexOf(status)), last = STATUS.length - 1;
      const track = el("div", { className: "inv-track", role: "img", ariaLabel: `สถานะ ${status} (ขั้น ${i + 1}/${last + 1})` },
        el("span", { className: "inv-track-line" }),
        el("span", { className: "inv-track-fill" + (i ? "" : " empty"), style: `width:${(i / last) * 100}%;--c:${STEP_COLOR[i]}` }),
        ...STATUS.map((s, k) => el("span", {
          className: "inv-node" + (k < i ? " done" : k === i ? " now" : ""), title: s,
          style: `left:${(k / last) * 100}%;--c:${STEP_COLOR[k]}`,
        })));
      return el("div", { className: "inv-status" }, el("span", { className: "inv-status-name", style: `color:${STEP_COLOR[i]}`, textContent: status }), track);
    }

    function render() {
      renderTabs();
      // admins: rows in the sheet the app could not read (or shows read-only), with the reason
      const bad = data.bad || [];
      $("invWarn").hidden = !bad.length;
      $("invWarnList").replaceChildren(...bad.map((b) => el("li", { textContent: `แถวที่ ${b.row}: ${b.reason}` })));
      const q = $("q").value.trim().toLowerCase();
      const shown = data.invoices.filter((i) =>
        (tab === "all" || (tab === "none" ? !i.type : i.type === tab)) &&
        (!q || i.subject.toLowerCase().includes(q) || i.building.toLowerCase().includes(q)));
      $("invCount").textContent = data.invoices.length;
      newBadge();
      const open = shown.filter((i) => i.status !== STATUS[STATUS.length - 1]); // outstanding = not at the last step
      const done = shown.filter((i) => !open.includes(i));
      // finished invoices sit in one closed group at the bottom; a search opens it so matches show
      const doneGroup = done.length && el("details", { className: "doc-group", open: !!q },
        el("summary", {}, `✅ ${STATUS[STATUS.length - 1]}`, el("span", { className: "badge", textContent: done.length }),
          el("span", { className: "muted", textContent: ` ฿${baht(done.reduce((s, i) => s + i.amount, 0))}` })),
        ...done.map(invoiceRow));
      if (doneGroup) doneGroup.dataset.key = "done"; // stays open / closed through an auto refresh
      $("invList").replaceChildren(...(shown.length ? [...open.map(invoiceRow), doneGroup].filter(Boolean)
        : [el("p", { className: "muted", textContent: data.invoices.length ? "ไม่พบรายการ" : "ยังไม่มีรายการเบิก" })]));
      $("invTotal").textContent = shown.length
        ? `รวม ${shown.length} รายการ ฿${baht(shown.reduce((s, i) => s + i.amount, 0))} · ค้าง ${open.length} รายการ ฿${baht(open.reduce((s, i) => s + i.amount, 0))}`
        : "";
    }

    // admins: red pill next to the count = invoices with files a หัวหน้าทีม added since you last opened their 📎
    function newBadge() {
      const n = data.invoices.filter((i) => data.newFiles?.[i.id]).length;
      $("invNew").hidden = !n;
      $("invNew").textContent = n;
      $("invNew").title = `มีไฟล์ใหม่จากหัวหน้าทีม ${n} รายการ · กด 📎 ที่มีจุดแดงเพื่อดู`;
    }

    // หัวหน้าทีม = the member who looks after the building (ข้อมูลการมอบหมาย)
    const ownerOf = (name) => data.buildings.find((b) => b.name === name)?.owner || "";
    // "ทุกนิติ" means every building: an invoice is always for one building, so it is not offered
    const pickable = () => data.buildings.filter((b) => !b.name.trim().startsWith("ทุกนิติ"));

    function showType() {
      const v = $("fBuilding").value.trim(), b = pickable().find((x) => x.name === v);
      $("fType").textContent = !v ? "" : !b ? "ไม่พบนิติบุคคลนี้ · เลือกจากรายการ"
        : [b.type ? "ประเภท: " + b.type : "ยังไม่ระบุประเภท — ตั้งได้ในชีต แท็บ Buildings คอลัมน์ type",
          "หัวหน้าทีม: " + (b.owner || "ยังไม่มีผู้ดูแล")].join(" · ");
    }

    /**
     * Searchable drop-down into `box` (a .ms div) for the hidden input `input`. options() -> [{ value, hint? }].
     * free: what is typed in the search box can be used as the value too. Returns sync() to redraw after a value change.
     */
    function picker(box, input, { empty, options, free = false, onPick }) {
      const btn = el("button", { type: "button", className: "ms-btn", id: input.id + "Btn" });
      btn.setAttribute("aria-haspopup", "true");
      const search = el("input", { type: "search", className: "ms-search", placeholder: free ? "ค้นหา หรือพิมพ์ใหม่" : "ค้นหา", ariaLabel: "ค้นหา" });
      const list = el("div", { className: "ms-list", role: "listbox" });
      const pop = el("div", { className: "ms-pop", hidden: true }, search, list);
      box.replaceChildren(btn, pop);
      const sync = () => { btn.textContent = input.value || empty; btn.classList.toggle("ms-empty", !input.value); };
      const open = (on) => {
        pop.hidden = !on;
        btn.setAttribute("aria-expanded", String(on));
        if (on) { search.value = ""; draw(); search.focus(); }
      };
      const choose = (v) => { input.value = v; sync(); open(false); btn.focus(); onPick?.(); };
      const opt = (text, value, hint) => el("button", { type: "button", className: "ms-opt" + (value === input.value ? " on" : ""), role: "option", onclick: () => choose(value) },
        text, hint && el("span", { className: "muted", textContent: " · " + hint }));
      function draw() {
        const q = search.value.trim(), ql = q.toLowerCase();
        const hits = options().filter((o) => !ql || o.value.toLowerCase().includes(ql) || (o.hint || "").toLowerCase().includes(ql));
        list.replaceChildren(
          ...(free && q && !hits.some((o) => o.value === q) ? [opt(`ใช้ "${q}"`, q)] : []),
          ...(free && input.value ? [opt("— ไม่ระบุ —", "")] : []),
          ...hits.map((o) => opt(o.value, o.value, o.hint)),
          ...(!hits.length && !(free && q) ? [el("p", { className: "muted", textContent: "ไม่พบ" })] : []));
      }
      search.oninput = draw;
      search.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); list.querySelector(".ms-opt")?.click(); } }; // Enter = first match
      btn.onclick = () => open(pop.hidden);
      document.addEventListener("pointerdown", (e) => { if (!pop.hidden && !box.contains(e.target)) open(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !pop.hidden) { open(false); btn.focus(); } });
      sync();
      return sync;
    }
    const pickers = [
      picker($("fBuildingPick"), $("fBuilding"), { empty: "เลือกนิติบุคคล", onPick: showType,
        options: () => pickable().map((b) => ({ value: b.name, hint: [b.type, b.owner].filter(Boolean).join(" · ") })) }),
      picker($("fSubjectPick"), $("fSubject"), { empty: "เลือกรายการเบิก", free: true, options: () => SUBJECTS.map((value) => ({ value })) }),
      picker($("fLawyerPick"), $("fLawyer"), { empty: "เลือกทนาย (ไม่บังคับ)", free: true,
        options: () => [...new Set([...LAWYERS, ...data.invoices.map((i) => i.lawyer).filter(Boolean)])].map((value) => ({ value })) }),
    ];

    function openInvForm(inv) {
      const f = $("invForm");
      f.reset();
      $("formMsg").textContent = "";
      $("fStatus").replaceChildren(...STATUS.map((s) => el("option", { value: s, textContent: s })));
      f.elements.id.value = inv?.id ?? ""; // via .elements: a field named "id" would shadow form.id
      // hidden inputs keep their value through reset(), so set all three every time
      f.building.value = inv?.building ?? ""; f.subject.value = inv?.subject ?? ""; f.lawyer.value = inv?.lawyer ?? "";
      if (inv) {
        f.amount.value = baht(inv.amount);
        f.billed_on.value = inv.billed_on ?? ""; f.transfer_on.value = inv.transfer_on ?? ""; f.receipt_on.value = inv.receipt_on ?? "";
        f.status.value = inv.status; f.note.value = inv.note ?? "";
      }
      pickers.forEach((sync) => sync());
      showType();
      f.hidden = false;
      f.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    $("q").oninput = render;
    $("addBtn").onclick = () => openInvForm(null);
    $("cancelBtn").onclick = () => { $("invForm").hidden = true; };
    $("invForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target, btn = e.submitter;
      // hidden inputs skip the browser's required check, so check here
      if (!pickable().some((b) => b.name === f.building.value.trim())) return void ($("formMsg").textContent = "เลือกนิติบุคคลจากรายการ · pick a building from the list");
      if (!f.subject.value.trim()) return void ($("formMsg").textContent = "เลือกรายการเบิก · pick a subject");
      btn.disabled = true;
      try {
        const { savedId, noticeError, ...rest } = await api("saveInvoice", Object.fromEntries(new FormData(f)));
        data = rest;
        render();
        if (noticeError) alert(noticeError); // saved; only the LINE message to the หัวหน้าทีม failed
        f.elements.id.value = savedId; // if an upload fails, Save again edits this invoice instead of adding another
        const files = [...$("fFiles").files];
        const { failed } = files.length ? await uploadInvoiceFiles(savedId, files, (t) => { $("formMsg").textContent = t; }) : { failed: [] };
        if (failed.length) {
          // keep only the failed files picked, so Save again retries just those
          const keep = new DataTransfer();
          failed.forEach((x) => keep.items.add(x));
          $("fFiles").files = keep.files;
        } else f.hidden = true;
      } catch (err) { $("formMsg").textContent = err.message; }
      btn.disabled = false;
    };

    // ?invoice=N: opened from the LINE message's กดเพื่อดูรายละเอียด button: show that invoice with its 📎 files open.
    // Dropped from the URL so a reload doesn't jump again.
    function showLinked() {
      const id = Number(new URLSearchParams(location.search).get("invoice"));
      if (!id) return;
      history.replaceState(null, "", location.pathname);
      if (!data.invoices.some((i) => i.id === id)) return;
      tab = "all";
      $("q").value = "";
      render();
      const row = $("invList").querySelector(`[data-inv="${id}"]`);
      const group = row.closest("details");
      if (group) group.open = true;
      row.querySelector('[title="ไฟล์แนบ"]').click();
      row.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    start("member").then(async (me) => {
      isAdmin = me.role === "admin";
      $("addBtn").hidden = !isAdmin;
      $("invScope").hidden = isAdmin; // the server already filtered the list for non-admins
      data = await api("listInvoices");
      $("status").hidden = true;
      $("page").hidden = false;
      render();
      showLinked();
      // the list refreshes by itself (every minute and when you come back); it waits while the form or a 📎 panel is open
      autoRefresh({ box: $("invList").closest(".card"), load: () => api("listInvoices"), draw: (d) => { data = d; render(); },
        busy: () => !!document.querySelector(".inv-files:not([hidden])") }).seen(data);
    }).catch((err) => {
      $("status").textContent = "Error: " + err.message;
      $("status").className = "error";
    });
  </script>
</body>
</html>

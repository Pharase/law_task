<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Document</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../js/app.js?v=20261111"></script>
  <script src="../js/work.js?v=20261111"></script>
  <link rel="stylesheet" href="../css/app.css?v=20261111">
</head>
<body>
  <p id="status" class="loading" role="status"></p>
  <div class="card" id="page" hidden>
    <input type="search" id="q" placeholder="ค้นหาชื่อเอกสาร · Search" aria-label="Search documents">
    <div id="docList"></div>
  </div>
  <script>
    let groups = [], docs = [];
    const kb = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB");
    // ดู only when the browser can show it (PDF, pictures); Word files are download-only. openFile handles the LINE app.
    const docRow = (d) => el("div", { className: "doc-row" },
      el("div", { className: "grow" }, el("strong", { textContent: d.title }),
        el("div", { className: "muted", textContent: `${fileType(d.name)} · ${kb(d.size)} · ${thDate(d.created_at.slice(0, 10))}` })),
      d.preview && el("button", { type: "button", className: "small", textContent: "ดู (Preview)", onclick: () => openFile(d.previewUrl) }),
      el("button", { type: "button", className: "small secondary", textContent: "ดาวน์โหลด", onclick: () => openFile(d.downloadUrl, true) }));

    function render() {
      const q = $("q").value.trim().toLowerCase();
      const shown = docs.filter((d) => d.title.toLowerCase().includes(q));
      // Groups start closed (tap to see the files); a search opens every matching group.
      $("docList").replaceChildren(...(shown.length ? groupDocs(groups, shown).map((s) =>
        el("details", { className: "doc-group", open: !!q },
          el("summary", {}, el("strong", { textContent: s.name }), el("span", { className: "badge", textContent: s.docs.length })),
          ...docsBySubgroup(s.docs, docRow)))
        : [el("p", { className: "muted", textContent: docs.length ? "ไม่พบเอกสาร" : "ยังไม่มีเอกสาร" })]));
    }

    $("q").oninput = render;
    start("member").then(async () => {
      ({ groups, docs } = await api("listExDocs")); // both already sorted A–Z (Thai-aware) by the server
      $("status").hidden = true;
      $("page").hidden = false;
      render();
    }).catch((err) => {
      $("status").textContent = "Error: " + err.message;
      $("status").className = "error";
    });
  </script>
</body>
</html>

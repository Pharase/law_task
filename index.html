<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIFF Login Test</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #f5f5f5; color: #222; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    img { width: 72px; height: 72px; border-radius: 50%; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px; font-size: 16px; color: #fff; background: #06c755; cursor: pointer; }
    button.secondary { background: #888; margin-top: 8px; }
    dt { font-weight: 600; margin-top: 8px; }
    dd { margin: 0; word-break: break-all; font-family: monospace; }
    .error { color: #c00; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>LIFF Login Test</h1>

  <div class="card">
    <dl>
      <dt>Environment</dt><dd id="env">loading…</dd>
      <dt>Status</dt><dd id="status">initializing…</dd>
    </dl>
  </div>

  <div class="card" id="loginCard" hidden>
    <button id="loginBtn">Login with LINE</button>
  </div>

  <div class="card" id="profileCard" hidden>
    <img id="avatar" alt="Profile picture">
    <dl>
      <dt>Name</dt><dd id="name"></dd>
      <dt>LINE userId (sub)</dt><dd id="userId"></dd>
      <dt>ID token (send this to backend)</dt><dd id="idToken"></dd>
    </dl>
    <button class="secondary" id="logoutBtn" hidden>Logout</button>
  </div>

  <script>
    const LIFF_ID = "2012450429-k3WOCwtO"; // from LINE Developers Console > LIFF tab

    const $ = (id) => document.getElementById(id);

    async function main() {
      await liff.init({ liffId: LIFF_ID });

      const inLine = liff.isInClient();
      $("env").textContent = (inLine ? "Inside LINE app" : "External browser") + " / OS: " + liff.getOS();

      if (!liff.isLoggedIn()) {
        $("status").textContent = "Not logged in";
        $("loginCard").hidden = false;
        // In a browser this redirects to LINE Login (email/password or QR code on PC)
        $("loginBtn").onclick = () => liff.login({ redirectUri: location.href });
        return;
      }

      const token = liff.getDecodedIDToken(); // display only; the backend must verify the raw token
      $("status").textContent = "Logged in";
      $("profileCard").hidden = false;
      $("name").textContent = token?.name ?? "-";
      $("userId").textContent = token?.sub ?? "-";
      $("idToken").textContent = liff.getIDToken() ?? "- (enable openid scope)";
      if (token?.picture) $("avatar").src = token.picture; else $("avatar").hidden = true;

      if (!inLine) {
        $("logoutBtn").hidden = false;
        $("logoutBtn").onclick = () => { liff.logout(); location.reload(); };
      }
    }

    main().catch((err) => {
      $("status").textContent = "Error: " + err.message;
      $("status").className = "error";
    });
  </script>
</body>
</html>

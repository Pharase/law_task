<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>law_task</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/app.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <h1>law_task</h1>
  <p id="status">Loading…</p>

  <!-- Not approved yet: enter invite code -->
  <form class="card" id="codeCard" hidden>
    <label for="code">Enter the 8-character invite code from your admin</label>
    <input id="code" maxlength="9" autocomplete="one-time-code" autocapitalize="characters" required>
    <button>Submit code</button>
    <p class="error" id="codeError" role="alert"></p>
  </form>

  <div class="card" id="lockedCard" hidden>
    <p class="error">Too many wrong codes. Please contact an admin for a new code.</p>
  </div>

  <!-- Approved -->
  <div id="appCard" hidden>
    <div class="card row">
      <img id="avatar" alt="">
      <div><strong id="name"></strong><br><span id="role" class="muted"></span></div>
    </div>
    <div class="card" id="adminCard" hidden>
      <a href="admin/members.html">Admin: members &amp; invite codes</a>
    </div>
    <div class="card">
      <label for="file">Upload a picture or PDF (max 10 MB, deleted after 1 year)</label>
      <input type="file" id="file" accept="image/*,application/pdf">
      <p id="uploadMsg" role="status"></p>
      <ul id="files"></ul>
    </div>
  </div>

  <script>
    function show(me) {
      $("status").hidden = true;
      $("codeCard").hidden = $("lockedCard").hidden = $("appCard").hidden = true;
      if (me.role === "member" || me.role === "admin") {
        $("appCard").hidden = false;
        $("name").textContent = me.staff_name || me.display_name;
        $("role").textContent = me.role;
        if (me.picture_url) $("avatar").src = me.picture_url;
        $("adminCard").hidden = me.role !== "admin";
        loadFiles();
      } else if (me.locked) {
        $("lockedCard").hidden = false;
      } else {
        $("codeCard").hidden = false;
      }
    }

    async function loadFiles() {
      $("files").replaceChildren(...(await api("myFiles")).map((f) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = f.url; a.target = "_blank"; a.textContent = f.name;
        li.append(a, ` (${Math.round(f.size / 1024)} KB, ${new Date(f.created_at).toLocaleDateString()})`);
        return li;
      }));
    }

    $("codeCard").onsubmit = async (e) => {
      e.preventDefault();
      $("codeError").textContent = "";
      try { show(await api("redeem", { code: $("code").value })); }
      catch (err) {
        if (err.message.startsWith("locked")) show({ locked: true });
        else $("codeError").textContent = err.message;
      }
    };

    $("file").onchange = async () => {
      const file = $("file").files[0];
      if (!file) return;
      $("uploadMsg").textContent = "Uploading…";
      try {
        const saved = await uploadFile(file);
        $("uploadMsg").textContent = `Saved ${Math.round(saved.size / 1024)} KB (original ${Math.round(file.size / 1024)} KB)`;
        $("file").value = "";
        loadFiles();
      } catch (err) { $("uploadMsg").textContent = "Error: " + err.message; }
    };

    start("any").then(show).catch((err) => {
      $("status").textContent = "Error: " + err.message;
      $("status").className = "error";
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property Right</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../js/app.js?v=20261111"></script>
  <link rel="stylesheet" href="../css/app.css?v=20261111">
  <style>
    /* totals: 4 tiles */
    .lien-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 14px; }
    .lien-tile { padding: 10px 8px; border: 1px solid var(--line-2); border-radius: 16px; background: rgba(255, 255, 255, .03); text-align: center; }
    .lien-tile b { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; }
    .lien-tile small { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.3; }
    .lien-tile.warn b { color: #ffd27a; }
    .lien-tile.lock b { color: var(--cyan); }
    @media (max-width: 420px) { .lien-tiles { grid-template-columns: repeat(2, 1fr); } }
    .lien-search { margin: 0 0 4px; }
    /* one building = one slim row; tap to expand */
    .lien-b { border-top: 1px solid var(--line); }
    .lien-b > summary { list-style: none; cursor: pointer; padding: 10px 2px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
    .lien-b > summary::-webkit-details-marker { display: none; }
    .lien-b > summary .nm { font-weight: 500; min-width: 0; }
    .lien-b > summary .nm::before { content: "▸ "; color: var(--ink-3); }
    .lien-b[open] > summary .nm::before { content: "▾ "; }
    .lien-b > summary .over { font-size: 14px; color: #ffd27a; white-space: nowrap; }
    .lien-b > summary .over.zero { color: var(--ink-3); }
    .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
    .bar i { flex: 1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
    .bar i::after { content: ""; display: block; height: 100%; width: var(--p); border-radius: 99px; background: linear-gradient(90deg, var(--cyan-2), var(--cyan)); }
    .lien-more { padding: 0 2px 12px 18px; display: grid; gap: 6px; font-size: 14px; }
    .lien-more .ln { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .lien-more .k { color: var(--ink-2); min-width: 92px; }
    .chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); white-space: nowrap; }
    .chip.ok { border-color: rgba(2, 215, 244, .5); color: #8ff1ff; }
    .chip.dim { color: var(--ink-3); }
    .lien-zero > summary { cursor: pointer; padding: 10px 2px; color: var(--ink-3); font-size: 14px; border-top: 1px solid var(--line); }
    .lien-zero p { margin: 0 0 10px; font-size: 13px; color: var(--ink-3); }
    /* admin: a building's people, stacked (no sideways scroll) */
    .person-row { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 6px; }
    .person-row .top { display: flex; gap: 8px; align-items: baseline; }
    .person-row .top b { white-space: nowrap; }
    .person-row .top span { flex: 1; min-width: 0; }
    .person-row .meta { font-size: 13px; color: var(--ink-2); }
    .person-row .badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .person-row .badges .badge { font-size: 12px; padding: 1px 9px; }
    .lien-form { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); margin: 6px 0; }
    .lien-form label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
    .lien-form label input[type=checkbox] { width: auto; margin: 0; accent-color: var(--blue); }
    .lien-form label.wide { grid-column: 1 / -1; flex-direction: column; align-items: stretch; gap: 2px; }
    .lien-form label.wide input, .lien-form label.wide textarea { margin: 0; }
  </style>
</head>
<body>
  <p id="status" class="loading" role="status"></p>
  <div id="page" hidden>
    <!-- computed by the app from the sheet tabs "รายชื่อค้างคสก (อช)" / "(จส)", same formulas as the old สรุปการดำเนินงาน (supabase/functions/api/lien.ts) -->
    <input class="lien-search" id="search" type="search" placeholder="🔍 ค้นหานิติบุคคล…" aria-label="ค้นหานิติบุคคล">
    <section class="card">
      <h2>🏢 อาคารชุด · สรุปการดำเนินงาน</h2>
      <div id="condo"></div>
    </section>
    <section class="card">
      <h2>🏡 หมู่บ้านจัดสรร · สรุปการดำเนินงาน</h2>
      <div id="village"></div>
    </section>
    <!-- admins only: one building's people -->
    <section class="card" id="detailCard" hidden>
      <div class="row card-head">
        <h2 class="grow" id="detailTitle"></h2>
        <button type="button" class="small secondary" id="detailClose" aria-label="ปิด · Close">✕</button>
      </div>
      <p class="muted small-note">แก้ได้เฉพาะสถานะ · ข้อมูลอื่น (ชื่อ, เดือนที่ค้าง, ยอด, เข้าเงื่อนไขเสนอราคา) แก้ในชีต</p>
      <p id="detailMsg" class="small-note" role="status"></p>
      <div id="detailList"></div>
    </section>
  </div>
  <script>
    const LABEL = {
      mortgage: "จำนอง", unknown: "ไม่ทราบข้อมูล", eligible: "เข้าเงื่อนไขเสนอราคา", quoted: "เสนอราคาทนาย", approved: "อนุมัติ", delayed: "ชะลอ",
      step: "ปัจจุบันดำเนินการถึงขั้นตอนไหน", note: "หมายเหตุ",
    };
    const KIND = {
      condo: { lien: "อายัด/บุริมสิทธิ์", date: "วันแจ้งบุริมสิทธิ์",
        flags: ["mortgage", "unknown", "eligible", "quoted", "approved", "delayed"], edit: ["mortgage", "unknown", "quoted", "approved", "delayed"] },
      village: { lien: "อายัด", date: "วันแจ้งอายัด",
        flags: ["eligible", "quoted", "approved", "delayed"], edit: ["quoted", "approved", "delayed"] },
    };
    const NUMS = ["over6", "eligible", "notEligible", "quoted", "approved", "delayed", "waiting", "todo", "doing", "done"];
    let isAdmin = false;
    let data = null; // last summary
    let open = null; // {kind, building}

    const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids.filter((k) => k != null && k !== false)); return e; };
    const chip = (text, n, cls = "") => h("span", { className: "chip " + (n ? cls : "dim"), textContent: `${text} ${n}` });
    const pct = (done, todo) => (todo > 0 ? Math.max(0, Math.min(100, Math.round((done / todo) * 100))) : 0) + "%";
    const bar = (label, done, todo) => {
      const b = h("div", { className: "bar" }, label, h("i"), todo > 0 ? `${done}/${todo}` : "—");
      b.style.setProperty("--p", pct(done, todo));
      return b;
    };
    const empty = (r) => NUMS.every((k) => !r[k]);

    function tiles(kind, rows) {
      const sum = (k) => rows.reduce((n, r) => n + r[k], 0);
      const tile = (cls, icon, n, label) => h("div", { className: "lien-tile " + cls }, h("b", { textContent: `${icon} ${n}` }), h("small", { textContent: label }));
      return h("div", { className: "lien-tiles" },
        tile("warn", "⚠️", sum("over6"), "ค้าง > 6 เดือน"),
        tile("", "⚖️", sum("eligible"), "เข้าเงื่อนไขเสนอฟ้อง"),
        tile("", "✅", sum("approved"), "อนุมัติฟ้อง"),
        tile("lock", "🔒", `${sum("done")}/${sum("todo")}`, `${KIND[kind].lien}แล้ว`));
    }

    function building(kind, r) {
      const k = KIND[kind];
      const more = h("div", { className: "lien-more" },
        h("div", { className: "ln" }, h("span", { className: "k", textContent: "⚖️ เงื่อนไขฟ้อง" }),
          chip("เข้า", r.eligible, "ok"), chip("ไม่เข้า", r.notEligible)),
        h("div", { className: "ln" }, h("span", { className: "k", textContent: "📝 เสนอราคา " + r.quoted }),
          chip("✅ อนุมัติ", r.approved, "ok"), chip("⏸ ชะลอ", r.delayed), chip("⏳ รอกรรมการ", r.waiting)),
        h("div", { className: "ln" }, h("span", { className: "k", textContent: `🔒 ${k.lien} ${r.todo}` }),
          chip("🔄 ระหว่างดำเนินการ", r.doing), chip("✅ เรียบร้อย", r.done, "ok")),
        isAdmin && h("div", {}, Object.assign(h("button", { type: "button", className: "small secondary", textContent: "📋 ดูรายชื่อ / แก้ไข" }),
          { onclick: () => openBuilding(kind, r.building) })));
      return h("details", { className: "lien-b" },
        h("summary", {},
          h("span", { className: "nm", textContent: r.building }),
          h("span", { className: "over" + (r.over6 ? "" : " zero"), textContent: `⚠️ ${r.over6}`, title: "ค้างชำระเกิน 6 เดือน" }),
          bar("🔒", r.done, r.todo)),
        more);
    }

    function fillKind(kind) {
      const q = $("search").value.trim();
      const all = data[kind];
      const rows = all.filter((r) => !q || r.building.includes(q))
        .sort((a, b) => b.over6 - a.over6 || b.todo - a.todo || a.building.localeCompare(b.building, "th"));
      const active = rows.filter((r) => !empty(r)), zero = rows.filter(empty);
      $(kind).replaceChildren(...[ // filter: replaceChildren would print a false as the text "false"
        tiles(kind, all),
        ...active.map((r) => building(kind, r)),
        !rows.length && h("p", { className: "muted", textContent: all.length ? "ไม่พบนิติบุคคลที่ค้นหา" : "ยังไม่มีข้อมูลในชีต" }),
        zero.length > 0 && h("details", { className: "lien-zero" },
          h("summary", { textContent: `··· ไม่มีรายการ ${zero.length} นิติ ▸` }),
          ...zero.map((r) => building(kind, r))),
      ].filter(Boolean));
    }
    const fillAll = (s) => { data = s; fillKind("condo"); fillKind("village"); };
    $("search").oninput = () => data && fillAll(data);

    async function openBuilding(kind, building) {
      open = { kind, building };
      $("detailCard").hidden = false;
      $("detailTitle").textContent = "📋 " + building;
      $("detailMsg").textContent = "";
      $("detailList").replaceChildren(h("p", { className: "loading", role: "status" }));
      fillLoaders?.();
      $("detailCard").scrollIntoView({ behavior: "smooth" });
      try { showItems((await api("lienDetail", { kind, building })).items); }
      catch (err) { $("detailList").replaceChildren(); $("detailMsg").textContent = "❌ " + err.message; }
    }
    $("detailClose").onclick = () => { $("detailCard").hidden = true; open = null; };

    const money = (v) => (v && !isNaN(v) ? Number(v).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ฿" : v || "-");

    function showItems(items) {
      const k = KIND[open.kind];
      const rows = items.map((it) => {
        const edit = h("button", { type: "button", className: "small secondary", textContent: "✏️ แก้ไข" });
        const view = h("div", { className: "person-row" },
          h("div", { className: "top" }, h("b", { textContent: "🏠 " + (it.unit || "-") }), h("span", { textContent: it.name }), edit),
          h("div", { className: "meta", textContent: `ค้าง ${it.months || "-"} เดือน · ${money(it.owed)}` }),
          h("div", { className: "badges" },
            ...k.flags.map((f) => h("span", { className: "badge " + (it[f] ? "on" : "off"), textContent: (it[f] ? "✓ " : "") + LABEL[f] })),
            it.notifiedOn && h("span", { className: "tag", textContent: `📅 ${k.date} ${it.notifiedOn}` })),
          (it.step || it.note) && h("div", { className: "meta", textContent: "📝 " + [it.step, it.note].filter(Boolean).join(" · ") }));
        edit.onclick = () => view.replaceWith(editRow(it, view));
        return view;
      });
      $("detailList").replaceChildren(...(rows.length ? rows : [h("p", { className: "muted", textContent: "ไม่มีรายชื่อ" })]));
    }

    function editRow(it, view) {
      const k = KIND[open.kind];
      const inputs = {};
      const form = h("div", { className: "lien-form" });
      for (const f of k.edit) {
        inputs[f] = h("input", { type: "checkbox", checked: !!it[f] });
        form.append(h("label", {}, inputs[f], LABEL[f]));
      }
      // text, not a date picker: old rows hold dates like "27 ตค 68" and must not be lost
      inputs.notifiedOn = h("input", { value: it.notifiedOn, placeholder: "เช่น 2026-11-10" });
      inputs.step = h("input", { value: it.step });
      inputs.note = h("textarea", { value: it.note, rows: 2 });
      form.append(h("label", { className: "wide" }, k.date, inputs.notifiedOn), h("label", { className: "wide" }, LABEL.step, inputs.step),
        h("label", { className: "wide" }, LABEL.note, inputs.note));
      const save = h("button", { type: "button", className: "small", textContent: "💾 บันทึก" });
      const cancel = h("button", { type: "button", className: "small secondary", textContent: "ยกเลิก" });
      const msg = h("span", { className: "small-note", role: "status" });
      const box = h("div", { className: "person-row" }, h("b", { textContent: `✏️ ${it.unit} · ${it.name}` }), form, h("div", { className: "row" }, save, cancel, msg));
      cancel.onclick = () => box.replaceWith(view);
      save.onclick = async () => {
        const patch = {}; // only what changed, so untouched cells (e.g. real dates) stay as they are
        for (const [f, input] of Object.entries(inputs)) {
          const v = input.type === "checkbox" ? input.checked : input.value.trim();
          if (v !== it[f]) patch[f] = v;
        }
        if (!Object.keys(patch).length) return box.replaceWith(view);
        save.disabled = true;
        msg.textContent = "กำลังบันทึก…";
        try {
          const r = await api("saveLien", { kind: open.kind, row: it.row, building: it.building, unit: it.unit, name: it.name, patch });
          fillAll(r.summary);
          showItems(r.items);
          $("detailMsg").textContent = `✅ บันทึก ${it.unit} แล้ว`;
        } catch (err) { msg.textContent = "❌ " + err.message; save.disabled = false; }
      };
      return box;
    }

    start("member").then(async (me) => {
      isAdmin = me.role === "admin";
      fillAll(await api("lienSummary"));
      $("status").hidden = true;
      $("page").hidden = false;
    }).catch((err) => {
      $("status").textContent = "Error: " + err.message;
      $("status").className = "error";
    });
  </script>
</body>
</html>

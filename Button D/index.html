<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/work.js"></script>
  <script src="../js/admin-tasks.js"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <p id="status" class="loading" role="status"></p>
  <div id="page" hidden>
    <!-- Admins only: tasks assigned vs sent over time -->
    <section class="card" id="activityCard" hidden>
      <h2>การมอบหมายและการส่งงาน · Assigned vs sent</h2>
      <div class="row filters">
        <select id="acPerson" aria-label="หัวหน้างาน · Person"></select>
        <select id="acRange" aria-label="ช่วงเวลา · Range">
          <option value="30">30 วันล่าสุด</option><option value="90">90 วันล่าสุด</option><option value="12m">12 เดือนล่าสุด</option>
        </select>
      </div>
      <div class="ac-legend" id="acLegend"></div>
      <div class="ac-chart" id="acChart"><p class="loading" role="status"></p></div>
      <details class="ac-table"><summary>ดูเป็นตาราง · Table</summary><div class="table-wrap" id="acTable"></div></details>
    </section>
    <section class="card">
      <h2>รายงานประจำเดือน · Monthly reports</h2>
      <p class="muted small-note">ดูหรือดาวน์โหลดได้ในแอป · เปิดแล้วได้ฉบับล่าสุดเสมอ</p>
      <div id="reportList"><p class="loading" role="status"></p></div>
    </section>
    <section class="card">
      <h2>ผลงาน · Performance</h2>
      <p class="muted">Members see their own scores; admins see the whole team.</p>
      <div class="row filters">
        <select id="pKind" aria-label="Period"><option value="month">เดือน</option><option value="quarter">ไตรมาส</option></select>
        <select id="pYear" aria-label="ปี · Year"></select>
        <select id="pN" aria-label="เดือนหรือไตรมาส · Month or quarter"></select>
      </div>
      <div class="table-wrap"><table id="perfTable"></table></div>
    </section>
  </div>
  <script>
    const busy = (b, on) => { b.disabled = on; b.classList.toggle("busy", on); };
    async function openReport(r, mode, btn) {
      // the preview window is opened before the wait, so phones do not block it as a pop-up
      const win = mode === "view" ? window.open("about:blank", "_blank") : null;
      busy(btn, true);
      try {
        const { previewUrl, downloadUrl } = await api("reportUrl", { id: r.id });
        const url = mode === "view" ? previewUrl : downloadUrl;
        if (win) win.location = url; else location.href = url; // download = attachment, the page stays
      } catch (err) { win?.close(); alert(err.message); }
      busy(btn, false);
    }
    async function loadMonthly() {
      const list = await api("listReports");
      $("reportList").replaceChildren(...(list.length ? list.map((r) => {
        const view = el("button", { type: "button", className: "small", textContent: "ดู (Preview)" });
        const down = el("button", { type: "button", className: "small secondary", textContent: "ดาวน์โหลด" });
        view.onclick = () => openReport(r, "view", view);
        down.onclick = () => openReport(r, "download", down);
        return el("div", { className: "doc-row" },
          el("div", { className: "grow" }, el("strong", { textContent: r.name.replace(/\.pdf$/i, "") }),
            el("div", { className: "muted", textContent: "อัปเดต " + thDate(r.modified.slice(0, 10)) })),
          view, down);
      }) : [el("p", { className: "muted", textContent: "ยังไม่มีรายงาน" })]));
    }
    start("member").then((me) => {
      initReports();
      if (me.role === "admin") {
        $("activityCard").hidden = false;
        initActivityChart().catch((err) => { $("acChart").textContent = "Error: " + err.message; });
      }
      loadMonthly().catch((err) => { $("reportList").textContent = "Error: " + err.message; });
    }).catch((err) => {
      $("status").textContent = "Error: " + err.message;
      $("status").className = "error";
    });
  </script>
</body>
</html>
